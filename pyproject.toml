[project]
name = "py2bbr"
version = "0.1.0"
description = "Convert Python packages into Yocto Project Bitbake recipes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "py2bbr contributors" },
]
keywords = [
    "yocto",
    "bitbake",
    "recipe",
    "python",
    "pip",
    "kas",
    "scarthgap",
    "pypi",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "packaging>=23.2",
    "PyYAML>=6.0.1",
    # kas is used to (a) validate the generated kas build file against the
    # official kas JSON schema and (b) drive the optional `--check build`
    # stage. Guarded at import time so core recipe generation degrades
    # gracefully if it is absent.
    "kas>=5.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-watcher>=0.6.3",
    "ruff<0.17",
]

[project.scripts]
py2bbr = "py2bbr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py2bbr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov py2bbr --cov-config .coveragerc --cov-report term-missing --cov-fail-under 28"

[tool.coverage.run]
source = ["py2bbr"]

[tool.ruff]
line-length = 80
target-version = "py311"
